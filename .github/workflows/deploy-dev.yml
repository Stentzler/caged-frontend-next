name: Deploy development frontend

# Deployment stages 1-5 are documented in .github/README.md.
# If you change this workflow, update the matching stages in .github/README.md.

on:
  push:
    branches: [develop]

permissions:
  contents: read
  id-token: write

concurrency:
  group: caged-frontend-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy development image
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      SSM_DEPLOYMENT_TARGET_PARAMETER: ${{ vars.SSM_DEPLOYMENT_TARGET_PARAMETER }}
      SSM_RUNTIME_ENV_PARAMETER: ${{ vars.SSM_RUNTIME_ENV_PARAMETER }}

    steps:
      - name: Check out the exact commit being deployed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.0.0

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Missing dev environment variable AWS_REGION}"
          : "${ECR_REPOSITORY_URL:?Missing dev environment variable ECR_REPOSITORY_URL}"
          : "${SSM_DEPLOYMENT_TARGET_PARAMETER:?Missing dev environment variable SSM_DEPLOYMENT_TARGET_PARAMETER}"
          : "${SSM_RUNTIME_ENV_PARAMETER:?Missing dev environment variable SSM_RUNTIME_ENV_PARAMETER}"

      - name: Install the exact Node.js dependencies
        run: npm ci

      - name: Check code before creating an image
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Obtain temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: caged-frontend-${{ github.run_id }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Resolve the current deployment target
        id: deployment-target
        run: |
          set -euo pipefail
          instance_id="$(aws ssm get-parameter \
            --name "$SSM_DEPLOYMENT_TARGET_PARAMETER" \
            --region "$AWS_REGION" \
            --query 'Parameter.Value' \
            --output text)"

          if [[ ! "$instance_id" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "Deployment target parameter did not contain a valid EC2 instance ID." >&2
            exit 1
          fi

          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      # Stage 1 — create the immutable image in ECR, or reuse it after a retry.
      - name: Build or reuse the immutable image
        id: image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_uri="$ECR_REPOSITORY_URL:$IMAGE_TAG"
          repository_name="${ECR_REPOSITORY_URL#*/}"
          lookup_error="$(mktemp)"
          trap 'rm --force "$lookup_error"' EXIT

          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            >/dev/null 2>"$lookup_error"; then
            echo "Reusing existing image $image_uri."
          elif grep --quiet "ImageNotFoundException" "$lookup_error"; then
            ecr_registry="${ECR_REPOSITORY_URL%/*}"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ecr_registry"
            docker build --platform linux/amd64 --tag "$image_uri" .
            docker push "$image_uri"
          else
            cat "$lookup_error" >&2
            exit 1
          fi

          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Deploy with SSM and roll back an unhealthy image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          SSM_INSTANCE_ID: ${{ steps.deployment-target.outputs.instance_id }}
        run: |
          set -euo pipefail

          cat > deployment-script.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          image_uri="$1"
          runtime_env_parameter="$2"
          aws_region="$3"
          container_name="caged-frontend-next"
          runtime_env_file="$(mktemp)"
          previous_image="$(docker inspect --format '{{.Config.Image}}' "$container_name" 2>/dev/null || true)"

          cleanup() {
            rm --force "$runtime_env_file"
          }

          start_container() {
            docker run --detach \
              --name "$container_name" \
              --restart unless-stopped \
              --publish 127.0.0.1:3000:3000 \
              --env-file "$runtime_env_file" \
              "$1"
          }

          application_is_healthy() {
            for attempt in {1..12}; do
              if docker exec "$container_name" node -e '
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5_000);
                fetch("http://127.0.0.1:3000/health", {signal: controller.signal})
                  .then(async (response) => {
                    if (!response.ok) throw new Error(`Health check returned ${response.status}`);
                    const body = await response.json();
                    if (body.status !== "ok") throw new Error("Unexpected health response");
                  })
                  .catch((error) => {
                    console.error(error.message);
                    process.exitCode = 1;
                  })
                  .finally(() => clearTimeout(timeout));
              '; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          trap cleanup EXIT

          aws ssm get-parameter \
            --name "$runtime_env_parameter" \
            --region "$aws_region" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text > "$runtime_env_file"
          chmod 600 "$runtime_env_file"
          test -s "$runtime_env_file"

          # Stage 2 — authenticate the EC2 host and download the selected image.
          ecr_registry="${image_uri%%/*}"
          aws ecr get-login-password --region "$aws_region" \
            | docker login --username AWS --password-stdin "$ecr_registry"
          docker pull "$image_uri"

          # Stage 3 — replace the running container with the downloaded image.
          docker rm --force "$container_name" 2>/dev/null || true
          start_container "$image_uri"

          # Stage 4 — verify the Next.js health route before completing deployment.
          if application_is_healthy; then
            echo "Deployment of $image_uri succeeded."
            exit 0
          fi

          # Stage 5 — restore the previous local image when the new one is unhealthy.
          echo "New image failed its local health check; attempting rollback." >&2
          docker rm --force "$container_name" 2>/dev/null || true

          if [[ -n "$previous_image" ]]; then
            start_container "$previous_image"
            application_is_healthy
            echo "Rollback to $previous_image succeeded." >&2
          else
            echo "No previous container image exists to restore." >&2
          fi

          exit 1
          SCRIPT

          {
            printf "bash -s -- %q %q %q <<'DEPLOYMENT_SCRIPT'\n" \
              "$IMAGE_URI" "$SSM_RUNTIME_ENV_PARAMETER" "$AWS_REGION"
            cat deployment-script.sh
            printf '\nDEPLOYMENT_SCRIPT\n'
          } | jq -Rs '{commands: [.]}' > ssm-parameters.json

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$SSM_INSTANCE_ID" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy caged frontend ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          if ! aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$SSM_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$SSM_INSTANCE_ID" || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$SSM_INSTANCE_ID"
